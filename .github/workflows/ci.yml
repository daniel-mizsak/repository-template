---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 6" # Every Saturday at 12:00

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    permissions:
      contents: read
    uses: daniel-mizsak/workflows/.github/workflows/prek.yml@9fc22b088e89dfacdd25003693d24b209b0d5768 # v2.3.1

  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: daniel-mizsak/workflows/.github/workflows/lint.yml@9fc22b088e89dfacdd25003693d24b209b0d5768 # v2.3.1
    with:
      megalinter-config: "./.github/linters/.megalinter.yml"
