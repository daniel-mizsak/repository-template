---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 6" # Every Saturday at 12:00

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    permissions:
      contents: read
    uses: daniel-mizsak/workflows/.github/workflows/prek.yml@92245e2677c21a319d87cc22d77a5841efe0e25f # v3.0.2

  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: daniel-mizsak/workflows/.github/workflows/lint-ci-light.yml@92245e2677c21a319d87cc22d77a5841efe0e25f # v3.0.2
    with:
      megalinter-config: "./.github/linters/.megalinter.yml"
