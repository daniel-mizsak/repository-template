---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 12 * * 6" # Every Saturday at 12:00

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    permissions:
      contents: read
    uses: daniel-mizsak/workflows/.github/workflows/prek.yml@47072f8671741e664ef3f0a01dc6ec1c8adf9c29 # v3.0.0

  lint:
    permissions:
      contents: read
      pull-requests: write
    uses: daniel-mizsak/workflows/.github/workflows/lint-ci-light.yml@47072f8671741e664ef3f0a01dc6ec1c8adf9c29 # v3.0.0
    with:
      megalinter-config: "./.github/linters/.megalinter.yml"
